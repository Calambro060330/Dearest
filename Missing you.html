<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Missing you</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;1,9..144,400&family=Caveat:wght@500&family=Great+Vibes&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#fbd3e0; --bg-glow:#fff1f6; --ink:#a3234f; --muted:#a8446c;
  --seal:#d6336c; --seal-hi:#f06292;
  --paper:#fffafc; --line:#f8d0de; --hand:#a02e5a;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#2b1220; --bg-glow:#4a1d33; --ink:#ffd3e2; --muted:#f0a3c0;
    --paper:#fff5f8; --line:#f6cddc; --hand:#a02e5a;
  }
}
:root[data-theme="dark"]{
  --bg:#2b1220; --bg-glow:#4a1d33; --ink:#ffd3e2; --muted:#f0a3c0;
  --paper:#fff5f8; --line:#f6cddc; --hand:#a02e5a;
}

*,*::before,*::after{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  margin:0;min-height:100%;background:var(--bg);color:var(--ink);
  font-family:"Fraunces",Georgia,"Times New Roman",serif;
  background-image:radial-gradient(ellipse at 50% 35%,var(--bg-glow),transparent 65%);
  background-repeat:no-repeat;background-size:100% 100vh;
  overflow-x:hidden;
}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
main{min-height:100vh;display:grid;place-items:center;padding:28px 18px}

/* ---------- envelope scene ---------- */
.scene{grid-area:1/1;display:grid;justify-items:center;gap:30px;text-align:center;transition:opacity .6s ease,transform .6s ease}
.scene.gone{opacity:0;transform:translateY(24px) scale(.96);pointer-events:none}
.hello{margin:0;font-size:clamp(1.5rem,6vw,2.1rem);font-weight:500;letter-spacing:-.01em}
.sub{margin:6px 0 0;color:var(--muted);font-style:italic;font-size:1.05rem}
.bq{
  position:relative;width:min(80vw,330px);cursor:pointer;outline-offset:8px;-webkit-tap-highlight-color:transparent;
  isolation:isolate;
}
.bq:focus-visible{outline:3px solid var(--seal)}
.bq svg{will-change:transform;display:block;width:100%;height:auto;overflow:visible;transform-origin:50% 95%;animation:sway 4s ease-in-out infinite}
@keyframes sway{0%,100%{transform:rotate(-1.6deg)}50%{transform:rotate(1.6deg)}}
.peek{transition:transform 1.1s cubic-bezier(.25,.8,.25,1) .15s}
.bq::before{content:"";position:absolute;inset:-14% -14% 6%;z-index:-1;border-radius:50%;background:radial-gradient(closest-side,rgba(255,140,185,.5),transparent);animation:glow 3.6s ease-in-out infinite}
.bq::after{content:"";position:absolute;left:20%;right:20%;bottom:-1%;height:5%;border-radius:50%;background:radial-gradient(closest-side,rgba(120,20,60,.35),transparent);z-index:-1}
@keyframes glow{0%,100%{opacity:.45;transform:scale(.94)}50%{opacity:1;transform:scale(1.04)}}
@keyframes bqpop{0%{transform:scale(1)}40%{transform:scale(1.05)}100%{transform:scale(1)}}
.bl{animation:bloomin .85s cubic-bezier(.3,1.5,.5,1) both}
@keyframes bloomin{from{transform:scale(0) rotate(-50deg);opacity:0}to{transform:none;opacity:1}}
.bq.open svg{animation:bqpop .6s ease}
.bq.open .peek{transform:translateY(36px);opacity:0;transition:transform .5s ease,opacity .35s ease}
.bq.open .front{transform:translateY(5px);transition:transform .6s ease}
.front{transition:transform .6s ease}
.tap{margin:0;color:var(--muted);font-size:1rem}

/* ---------- envelope stage ---------- */
:root{--env:#e9a9b4;--env-front:#f0bcc5;--flap:#e29aa8}
.stage2{grid-area:1/1;opacity:0;visibility:hidden;pointer-events:none;transition:opacity .6s ease,transform .7s ease}
.stage2.show{opacity:1;visibility:visible;transition-delay:.4s}
.stage2.out{visibility:visible;opacity:0;transform:translateY(-20px);transition-delay:0s}
@keyframes wig{0%,100%{transform:rotate(0)}20%{transform:rotate(-2.6deg)}45%{transform:rotate(2.6deg)}70%{transform:rotate(-1.4deg)}}
.fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:5}
.env{
  position:relative;width:min(58vw,240px);aspect-ratio:62/88;background:#fffafa;border:1px solid #efc3cf;border-radius:3px;
  perspective:900px;box-shadow:0 18px 36px -14px rgba(90,20,40,.45);
}
.stage2.show .env{animation:envin .85s ease-out .4s both,wig .5s ease 1.2s}
@keyframes envin{0%{opacity:0;transform:translateY(70px) scale(.5)}55%{opacity:1;transform:translateY(-14px) scale(1.07)}100%{opacity:1;transform:none}}
.ep{z-index:1;position:absolute;left:8%;right:8%;top:5%;bottom:4%;background:#fff;border:1px solid #efc3cf;border-radius:2px;
  box-shadow:0 2px 8px rgba(90,20,40,.16);transition:transform .9s cubic-bezier(.3,.7,.2,1) .45s}
.ep{display:grid;place-items:start center;padding-top:16%;text-align:center}
.ep span{font-family:"Great Vibes","Snell Roundhand","Segoe Script","Brush Script MT",cursive;font-size:clamp(1.5rem,7vw,2rem);line-height:1.1;color:#d6336c}
.fr2{z-index:2;position:absolute;inset:0;background:#fffafa;
  clip-path:polygon(0 0,50% 39%,100% 0,100% 100%,0 100%)}
.flap{position:absolute;left:-1px;right:-1px;top:-1px;height:39%;background:#efc3cf;
  clip-path:polygon(0 0,100% 0,50% 100%);transform-origin:50% 0;
  transition:transform .7s ease,z-index 0s linear .35s;z-index:3}
.flap::after{content:"";position:absolute;inset:0;background:#f6cdd8;clip-path:polygon(2.4% 0,97.6% 0,50% 91%);transition:background .7s ease}
.seal{position:absolute;left:50%;top:39%;width:26%;aspect-ratio:1;z-index:4;border-radius:50%;background:#d6336c;
  box-shadow:0 2px 5px rgba(60,0,20,.35);transform:translate(-50%,-50%);transition:opacity .3s ease,transform .3s ease}
.env.open .flap{transform:rotateX(180deg);z-index:0}
.env.open .flap::after{background:#e9b3c3}
.env.open .seal{opacity:0;transform:translate(-50%,-50%) scale(.4)}
.env.open .ep{transform:translateY(-58%)}
.bf{position:fixed;inset:0;z-index:9;pointer-events:none;display:none;overflow:hidden}
.bf.on{display:block}
.bf .back{position:absolute;inset:0;opacity:0;transition:opacity 1s ease .4s;background:radial-gradient(circle at var(--ox,50%) var(--oy,50%),#f9a8c6,#f06292)}
.bf.fill .back{opacity:1}
.bf .fl{position:absolute;will-change:transform;transform:scale(0);animation:flbloom .75s cubic-bezier(.3,1.35,.5,1) both}
.bf .fl svg{display:block;width:100%;height:100%}
@keyframes flbloom{from{transform:scale(0) rotate(var(--r0,-50deg));opacity:0}to{transform:scale(1) rotate(var(--r1,0deg));opacity:1}}
.bf.out{opacity:0;transform:scale(1.1);transition:opacity .7s ease,transform .7s ease}
.snd{position:fixed;top:calc(env(safe-area-inset-top,0px) + 10px);right:12px;z-index:20;background:var(--bg);
  color:var(--ink);border:1px solid var(--muted);border-radius:999px;font:inherit;font-size:.9rem;padding:8px 14px;cursor:pointer}
.snd:focus-visible{outline:3px solid var(--seal);outline-offset:3px}

/* ---------- letter scene ---------- */
.letter{grid-area:1/1;display:none;width:min(100%,560px);padding:8px 0 40px}
.letter.show{display:block;animation:rise .9s cubic-bezier(.2,.7,.2,1) both}
@keyframes rise{from{opacity:0;transform:translateY(60px) rotate(-1.2deg)}to{opacity:1;transform:none}}
.paper{
  background:var(--paper);color:var(--hand);border-radius:4px;padding:34px 28px 38px;
  box-shadow:0 22px 50px -18px rgba(90,20,40,.5);
  background-image:repeating-linear-gradient(to bottom,transparent 0,transparent 35px,var(--line) 35px,var(--line) 36px);
  background-position:0 30px;
}
.paper h1{margin:0 0 22px;font-family:"Great Vibes","Snell Roundhand","Segoe Script","Brush Script MT",cursive;font-size:clamp(2.3rem,10vw,3rem);font-weight:400;color:#d6336c;line-height:1.15}
.letter.show .paper h1.rv{animation:wipe 1.8s ease both;animation-delay:.3s}
.paper .to,.paper p,.paper .sig{font-family:"Caveat","Segoe Script","Bradley Hand",cursive;font-size:1.55rem;line-height:36px;margin:0}
.paper .to{margin-bottom:36px}
.paper p{margin-bottom:36px}
.paper .sig{margin-top:12px}
.paper{position:relative}
.garland{display:block;width:100%;max-width:300px;margin:26px auto 0;overflow:visible}
.corner{position:absolute;top:-30px;right:-12px;width:112px;height:auto;pointer-events:none;overflow:visible}
.photos{display:grid;gap:26px;justify-items:center;margin:6px 0 40px}
.pol{margin:0;width:84%;background:#fff;padding:10px 10px 28px;box-shadow:0 10px 24px -10px rgba(90,20,40,.5);rotate:var(--r,0deg)}
.pol:nth-child(1){--r:-2.4deg}.pol:nth-child(2){--r:1.8deg}.pol:nth-child(3){--r:-1.2deg}
.pol img{display:block;width:100%;height:auto;background:var(--line)}
.paper .name{display:table;font-size:1.9rem}
.letter.show .again{animation:ink .8s ease both;animation-delay:calc(.25s * var(--n,9))}
.letter.show .rv{animation:ink .9s ease both;animation-delay:calc(.25s * var(--i,0))}
.letter.show .name{animation:wipe 1.5s ease both;animation-delay:var(--j,2s)}
@keyframes ink{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes wipe{from{clip-path:inset(-10% 100% -10% 0)}to{clip-path:inset(-10% 0 -10% 0)}}
.again{
  display:block;margin:26px auto 0;background:none;border:1px solid var(--muted);color:var(--ink);
  font:inherit;font-size:1rem;padding:11px 22px;border-radius:999px;cursor:pointer;
}
.again:hover{background:var(--bg-glow)}
.again:focus-visible{outline:3px solid var(--seal);outline-offset:3px}
@media (prefers-reduced-motion:reduce){
  .bq svg{animation:none}
  *{transition-duration:.01s!important;transition-delay:0s!important}
  .letter.show{animation:none}
  *{animation-duration:.01s!important;animation-delay:0s!important;animation-iteration-count:1!important}
}
</style>
</head>

<script>
/* ===== Edit this block to personalise the letter ===== */
var LETTER = {
  envelopeTitle: "Missing you",
  envelopeSub: "For Casey Marie Lois",
  title: "Missing you, Casey",
  to: "",
  paragraphs: [
    "You know what bhi i cant lie nga I dont missch you because I missesch you so much even though i cant explain how, guro sa comfort kag peace nga upod ta (unli kissch kagid saakon next time) pero sure gid ako sa presence mo kay mas okay ako kung ara ka and I guess its also because i love you kag bal an mo naman nach."
  ],
  closing: "Love,",
  from: "Randolph"
};
/* ====================================================== */

(function(){
  var $ = function(id){return document.getElementById(id)};
  $("hello").textContent = LETTER.envelopeTitle;
  $("sub").textContent = LETTER.envelopeSub;
  $("title").textContent = LETTER.title;
  $("to").textContent = LETTER.to;
  if(!LETTER.to) $("to").style.display = "none";
  $("closing").textContent = LETTER.closing;
  $("from").textContent = LETTER.from;
  LETTER.paragraphs.forEach(function(t){
    var p = document.createElement("p"); p.textContent = t; $("body").appendChild(p);
  });
  document.title = LETTER.envelopeTitle;

  var rv = [$("title"), $("to")].concat([].slice.call($("body").children), [].slice.call(document.querySelectorAll(".pol")), [document.querySelector(".sig")]);
  rv.forEach(function(el, i){ el.classList.add("rv"); el.style.setProperty("--i", i); });
  document.querySelector(".name").style.setProperty("--j", (rv.length * .25 + .3) + "s");
  $("again").style.setProperty("--n", rv.length + 3);

  var NS = "http://www.w3.org/2000/svg";
  [].slice.call(document.querySelectorAll("#bq use")).forEach(function(u, i){
    var x = +u.getAttribute("x"), y = +u.getAttribute("y"), w = +u.getAttribute("width"), h = +u.getAttribute("height");
    var o = document.createElementNS(NS, "g"), n = document.createElementNS(NS, "g");
    o.setAttribute("transform", "translate(" + (x + w/2) + " " + (y + h/2) + ")");
    n.setAttribute("class", "bl"); n.style.animationDelay = (.1 + i * .055) + "s";
    u.setAttribute("x", -w/2); u.setAttribute("y", -h/2);
    u.parentNode.insertBefore(o, u); o.appendChild(n); n.appendChild(u);
  });

  /* ---------- falling petals ---------- */
  var cv = $("fx"), g2 = cv.getContext("2d"), parts = [], raf = 0, ambient = false, W = 0, H = 0;
  var still = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
  var COL = ["#f8a8c4","#f27cab","#fcd0e0","#e8508b","#ffc2d6"];
  function fit(){
    var r = Math.min(window.devicePixelRatio || 1, 1.5);
    W = innerWidth; H = innerHeight; cv.width = W * r; cv.height = H * r;
    g2.setTransform(r, 0, 0, r, 0, 0);
  }
  fit(); addEventListener("resize", fit);
  function petal(x, y, vx, vy, amb){
    parts.push({x:x, y:y, vx:vx, vy:vy, r:Math.random()*6.28, vr:(Math.random()-.5)*.14,
      s:6 + Math.random()*7, life:amb ? 9999 : 110 + Math.random()*90, amb:amb, ph:Math.random()*6.28,
      c:COL[(Math.random()*COL.length)|0]});
  }
  function petals(x, y, n){
    if(still) return;
    for(var i=0;i<n;i++){
      var a = -Math.PI/2 + (Math.random()-.5)*2.6, sp = 2.2 + Math.random()*4.2;
      petal(x, y, Math.cos(a)*sp, Math.sin(a)*sp, false);
    }
    kick();
  }
  var skip = false;
  function frame(){
    var onlyAmb = true;
    for(var k=0;k<parts.length;k++){ if(!parts[k].amb){ onlyAmb = false; break; } }
    if(onlyAmb && (skip = !skip)){ raf = requestAnimationFrame(frame); return; }
    g2.clearRect(0, 0, W, H);
    if(ambient && parts.length < 9 && Math.random() < .035) petal(Math.random()*W, -16, 0, .6 + Math.random()*.6, true);
    for(var i=parts.length-1;i>=0;i--){
      var p = parts[i];
      if(p.amb){ p.ph += .03; p.x += Math.sin(p.ph) * .7; p.y += p.vy; }
      else { p.vx *= .985; p.vy = p.vy * .99 + .07; p.x += p.vx; p.y += p.vy; p.life--; }
      p.r += p.vr;
      if(p.life <= 0 || p.y > H + 24){ parts.splice(i, 1); continue; }
      g2.save(); g2.translate(p.x, p.y); g2.rotate(p.r);
      g2.globalAlpha = p.amb ? .7 : Math.min(1, p.life / 30);

    }
    raf = (parts.length || ambient) ? requestAnimationFrame(frame) : 0;
  }
  function kick(){ if(!raf) raf = requestAnimationFrame(frame); }
  var bf = $("bf");
  var PAL = [["#f8a8c4","#fcd0e0"],["#ee6fa0","#f6a0c0"],["#f27cab","#f9b4cd"],["#e8508b","#f48db4"],["#fbbcd2","#fde0eb"],["#ffd1e0","#fff0f5"],["#f06292","#f8bbd0"]];
  function growField(){
    var W = innerWidth, H = innerHeight, b = bq.getBoundingClientRect();
    var ox = b.left + b.width/2, oy = b.top + b.height*.4;
    bf.innerHTML = '<div class="back"></div>';
    bf.style.setProperty("--ox", ox + "px"); bf.style.setProperty("--oy", oy + "px");
    var cols = Math.ceil(W/140), rows = Math.ceil(H/140), cw = W/cols, ch = H/rows, list = [], maxD = 1;
    for(var r=0;r<rows;r++) for(var c=0;c<cols;c++){
      var cx = (c+.5)*cw + (Math.random()-.5)*cw*.3, cy = (r+.5)*ch + (Math.random()-.5)*ch*.3;
      var d = Math.sqrt((cx-ox)*(cx-ox) + (cy-oy)*(cy-oy)); if(d > maxD) maxD = d;
      list.push({x:cx, y:cy, d:d, sz:Math.max(cw,ch)*(1.55 + Math.random()*.65)});
    }
    list.forEach(function(f){
      var p = PAL[(Math.random()*PAL.length)|0], el = document.createElement("div");
      el.className = "fl";
      el.style.cssText = "left:"+(f.x-f.sz/2)+"px;top:"+(f.y-f.sz/2)+"px;width:"+f.sz+"px;height:"+f.sz+"px;"
        + "--p1:"+p[0]+";--p2:"+p[1]+";--r0:"+(-70+Math.random()*60)+"deg;--r1:"+((Math.random()-.5)*40)+"deg;"
        + "animation-delay:"+(f.d/maxD*1.0).toFixed(2)+"s";
      el.innerHTML = '<svg viewBox="0 0 100 100"><use href="#bloom" width="100" height="100"/></svg>';
      bf.appendChild(el);
    });
    bf.classList.remove("out"); bf.classList.add("on");
    void bf.offsetWidth; bf.classList.add("fill");
  }
  function clearField(){ bf.classList.remove("on","out","fill"); bf.innerHTML = ""; }
  function centre(el){ var b = el.getBoundingClientRect(); return [b.left + b.width/2, b.top + b.height*.35]; }

  /* ---------- sound (all synthesised, no files) ---------- */
  var AC = window.AudioContext || window.webkitAudioContext;
  var ctx = null, master, musicGain, sfx, echo, noise, muted = false, musicOn = false;
  var CH = [[130.81,164.81,196,246.94],[110,130.81,164.81,196],[87.31,110,130.81,164.81],[98,123.47,146.83,164.81]];
  var bar = 0, nextT = 0, BAR = 3.64;

  function initAudio(){
    if(ctx || !AC) return;
    try{
      ctx = new AC({latencyHint: "playback"});
      master = ctx.createGain(); master.gain.value = muted ? 0 : 1; master.connect(ctx.destination);
      musicGain = ctx.createGain(); musicGain.gain.value = 0; musicGain.connect(master);
      sfx = ctx.createGain(); sfx.gain.value = 1; sfx.connect(master);
      echo = ctx.createDelay(1); echo.delayTime.value = .42;
      var fb = ctx.createGain(); fb.gain.value = .34;
      var lp = ctx.createBiquadFilter(); lp.type = "lowpass"; lp.frequency.value = 1700;
      echo.connect(lp); lp.connect(fb); fb.connect(echo); lp.connect(musicGain);
      var n = ctx.sampleRate; noise = ctx.createBuffer(1, n, n);
      var d = noise.getChannelData(0); for(var i=0;i<n;i++) d[i] = Math.random()*2-1;
    }catch(e){ ctx = null; }
  }
  function tone(f, t, vol, dur, out, type){
    var o = ctx.createOscillator(), g = ctx.createGain();
    o.type = type || "sine"; o.frequency.value = f;
    g.gain.setValueAtTime(.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + .012);
    g.gain.exponentialRampToValueAtTime(.0001, t + dur);
    o.connect(g); g.connect(out); o.start(t); o.stop(t + dur + .05);
    return g;
  }
  function pluck(f, t, vol){
    var g1 = tone(f, t, vol, 1.7, musicGain, "sine");
    g1.connect(echo);
  }
  function pad(f, t, dur, vol){
    var lp = ctx.createBiquadFilter(); lp.type = "lowpass"; lp.frequency.value = 1000; lp.connect(musicGain);
    [3].forEach(function(c, i){
      var o = ctx.createOscillator(), g = ctx.createGain();
      o.type = "triangle"; o.frequency.value = f; o.detune.value = c;
      g.gain.setValueAtTime(0, t);
      g.gain.linearRampToValueAtTime(vol, t + 1.2);
      g.gain.setValueAtTime(vol, t + dur);
      g.gain.linearRampToValueAtTime(0, t + dur + 1.3);
      o.connect(g); g.connect(lp); o.start(t); o.stop(t + dur + 1.4);
    });
  }
  function scheduleBar(){
    if(!ctx || !musicOn) return;
    var c = CH[bar % 4], t = nextT, step = BAR / 8;
    [1,2,3].forEach(function(i){ pad(c[i]*2, t, BAR, .045); });
    pad(c[0], t, BAR, .05);
    [0,1,2,3,2,1,3,2].forEach(function(ix, k){ pluck(c[ix]*2, t + k*step, .085); });
    if(bar % 2 === 1){ pluck(c[3]*4, t + 6*step, .05); pluck(c[2]*4, t + 7*step, .045); }
    nextT += BAR; bar++;
    setTimeout(scheduleBar, Math.max(200, (nextT - ctx.currentTime - 1.2) * 1000));
  }
  function startMusic(){
    if(!ctx || musicOn) return;
    musicOn = true; nextT = ctx.currentTime + .15; bar = 0;
    musicGain.gain.setValueAtTime(0, ctx.currentTime);
    musicGain.gain.linearRampToValueAtTime(.55, ctx.currentTime + 4);
    scheduleBar();
  }
  function burst(t, dur, f, q, vol, f2){
    var s = ctx.createBufferSource(); s.buffer = noise; s.loop = true;
    var bp = ctx.createBiquadFilter(); bp.type = "bandpass"; bp.Q.value = q; bp.frequency.setValueAtTime(f, t);
    if(f2) bp.frequency.exponentialRampToValueAtTime(f2, t + dur);
    var g = ctx.createGain();
    g.gain.setValueAtTime(.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + dur*.3);
    g.gain.exponentialRampToValueAtTime(.0001, t + dur);
    s.connect(bp); bp.connect(g); g.connect(sfx); s.start(t); s.stop(t + dur + .05);
  }
  function rustle(){
    if(!ctx) return; var t = ctx.currentTime;
    for(var i=0;i<7;i++) burst(t + i*.07 + Math.random()*.03, .1, 2200 + Math.random()*2200, .9, .1);
  }
  function swoosh(){ if(ctx) burst(ctx.currentTime, .6, 500, 1.2, .1, 2400); }
  function pop(){
    if(!ctx) return; var t = ctx.currentTime;
    var o = ctx.createOscillator(), g = ctx.createGain();
    o.frequency.setValueAtTime(430, t); o.frequency.exponentialRampToValueAtTime(110, t + .09);
    g.gain.setValueAtTime(.25, t); g.gain.exponentialRampToValueAtTime(.001, t + .14);
    o.connect(g); g.connect(sfx); o.start(t); o.stop(t + .18);
  }
  function sparkle(){
    if(!ctx) return; var t = ctx.currentTime;
    [1046.5,1318.5,1568,2093].forEach(function(f, i){ tone(f, t + i*.09, .07, 1.4, sfx); });
  }
  function warmChime(){
    if(!ctx) return; var t = ctx.currentTime;
    [523.25,659.25,783.99].forEach(function(f, i){ tone(f, t + i*.13, .09, 2.2, sfx); tone(f*2, t + i*.13, .025, 1.6, sfx); });
  }

  var snd = $("snd");
  snd.addEventListener("click", function(){
    muted = !muted;
    snd.textContent = muted ? "Sound off" : "Sound on";
    snd.setAttribute("aria-pressed", muted ? "false" : "true");
    if(ctx){ master.gain.setTargetAtTime(muted ? 0 : 1, ctx.currentTime, .05); }
  });
  document.addEventListener("visibilitychange", function(){
    if(!ctx) return;
    if(document.hidden) ctx.suspend(); else ctx.resume();
  });

  /* ---------- opening sequence ---------- */
  var bq = $("bq"), scene = $("scene"), stage2 = $("stage2"), env2 = $("env2"), letter = $("letter"), busy = false;
  function openIt(){
    if(busy || bq.classList.contains("open")) return;
    busy = true;
    initAudio();
    if(ctx){ ctx.resume(); startMusic(); }
    rustle();
    bq.classList.add("open");
    var c = centre(bq); petals(c[0], c[1] - 20, 16);
    setTimeout(function(){ swoosh(); growField(); }, 350);
    setTimeout(sparkle, 1300);
    setTimeout(function(){ scene.classList.add("gone"); stage2.classList.add("show"); }, 2100);
    setTimeout(function(){ bf.classList.add("out"); }, 2250);
    setTimeout(clearField, 3100);
    setTimeout(function(){
      pop(); env2.classList.add("open");
      var e = centre(env2); petals(e[0], e[1], 24);
    }, 3850);
    setTimeout(sparkle, 4000);
    setTimeout(swoosh, 4350);
    setTimeout(function(){
      stage2.classList.add("out");
      letter.classList.add("show");
      warmChime();
      petals(innerWidth / 2, 90, 26);
      if(!still){ ambient = true; kick(); }
      window.scrollTo(0, 0);
      busy = false;
    }, 5900);
  }
  bq.addEventListener("click", openIt);
  bq.addEventListener("keydown", function(e){
    if(e.key === "Enter" || e.key === " "){ e.preventDefault(); openIt(); }
  });
  $("again").addEventListener("click", function(){
    rustle(); ambient = false; clearField();
    letter.classList.remove("show");
    stage2.classList.remove("show"); stage2.classList.remove("out");
    env2.classList.remove("open");
    bq.classList.remove("open");
    scene.classList.remove("gone");
    window.scrollTo(0, 0);
  });
})();
</script>
</body>
